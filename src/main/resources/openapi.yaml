openapi: 3.1.0
info:
  title: On-Class Technology API
  version: 1.0.0
  description: Microservicio de tecnologías.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /technologies:
    post:
      operationId: createTechnology
      summary: Registrar tecnología
      description: Registra una tecnología. Requiere rol ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyRequest'
            example:
              name: Java
              description: Lenguaje de programación
      responses:
        '201':
          description: Tecnología registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnologyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requiere rol ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe una tecnología con ese nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  message: A technology with this name already exists.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de Persona con rol ADMIN.
  schemas:
    TechnologyRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Nombre obligatorio y único, sin espacios en los extremos.
          example: Java
        description:
          type: string
          minLength: 1
          maxLength: 90
          description: Descripción obligatoria, sin espacios en los extremos.
          example: Lenguaje de programación
    TechnologyResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 50
          example: Java
        description:
          type: string
          maxLength: 90
          example: Lenguaje de programación
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          required: [message]
          properties:
            message:
              type: string
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Autenticación fallida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: No se pudo completar la operación en la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
